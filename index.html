<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Set</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    
    <!-- 
    Link external script with defer attrib for performance reccommended by:
    https://dev.to/dcodeyt/the-best-way-to-load-external-javascript-files-into-your-html-file-3o5d
    --> 
    <script src="script.js" defer></script>

</head>
<body>
    <header>
        <h1>DJ PublicDomain's coding set</h1>
    </header>

    <main class="container">
        <div class="media-player">
            <video id="custom-video-player" controls>
                <source
                src="https://thelongesthumstore.sgp1.cdn.digitaloceanspaces.com/IM-2250/miac.mp4"
                type="video/mp4"
                />
            </video>
            <div class="custom-controls">
                <!-- removed onclick attribute in favour of keeping all behaviour in script.js-->
                <button id="play-pause-img">
                    <img
                        src="https://fill.this.link/later"
                        alt="Play Button"
                        width="24"
                        height="24"
                    />
                </button>
            </div>
        </div>
    </main>
   
</body>
</html>
